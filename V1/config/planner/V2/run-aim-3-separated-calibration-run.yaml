# PsychoPy task configuration - generated by the MRI Experimental Design Planner.
# Study:      Inner Speech Decoding
# Run design: Aim 3 — Separated calibration run (trial design: Aim 3 — Separated calibration trial)
# Objective:  separation
# Card:       EPI-Base-Template, TR 2000 ms
# Used by:    V2 — Study plan
# Generated:  2026-09-29 15:44
#
# One run of this file is 8 trials, 6.4 - 8.0 min.
# The plan calls for 83 runs in total, 664 trials.
# The scanner, run and trial blocks and the condition counts are filled
# in from the solved design. Everything else is the lab template, unchanged.

experiment: aim_3_separated_calibration_run

paths:
  data_dir: data                 # the common JSON database lives here
  bank: questions/bank.json
  images_dir: questions/images

window:
  size: [1280, 800]
  fullscreen: true
  screen: 0
  color: [-1, -1, -1]            # PsychoPy rgb, -1..1  (black)
  units: height
  mouse_visible: false

text:
  font: Arial
  height: 0.06
  wrap_width: 1.3
  color: [1, 1, 1]
  title_pos: [0, 0.30]           # where views that also show graphics put the text

fixation:
  text: "+"
  height: 0.08
  color: [1, 1, 1]

cue:
  height: 0.12
  color: [1, 1, 1]

scanner:
  tr: 2.0                        # EPI-Base-Template
  trigger_key: "5"
  wait_for_triggers: 8           # dummy volumes; t=0 is the LAST of these pulses
  log_triggers: true             # every pulse is written to the database

run:
  lead_in: 12.0
  lead_out: 12.0
  n_blocks: 1
  trials_per_block: 8            # -> 8 trials/run
  inter_block_rest: 0.0          # rest between blocks, inside the run
  inter_trial_gap: 0.0           # dead time between successive trials

trial:
  round_jitter_to_tr: false      # uniform phases are sized as continuous draws; geometric is always whole TRs
  jitter: geometric              # uniform | exponential | geometric, for every [lo, hi] phase
  jitter_p: 0.5                  # geometric: chance the event comes on the next TR
  phases:
    - {name: fixation,         show: fixation, dur: [2.0, 6.0]}    # n_max 2
    - {name: long_wait,        show: blank,    dur: [10.0, 14.0]}  # n_max 2
    - {name: answer_cue,       show: cue,      dur: 1.0}
    - {name: paced_repetition, show: cue,      dur: 6.0}
    - {name: rest_tail,        show: fixation, dur: [24.0, 28.0]}  # n_max 2

# Trial conditions. `per_run` must sum to n_blocks * trials_per_block (8).
# The trial design embeds no control trials, so every trial is primary.
# response = the token the participant actually repeats during the answer window.
#   answer   -> the true answer          none  -> stay silent
#   opposite -> the inverted answer      ready -> the constant word "ready"
# cue_from_response: the cue displays the token itself (used for cue-only trials).
conditions:
  primary:       {per_run: 8, cue: "●", show_question: true,  response: answer}
  passive_read:  {per_run: 0, cue: "○", show_question: true,  response: none}
  cue_only:      {per_run: 0, cue: "◆", show_question: false, response: answer, cue_from_response: true}
  constant_word: {per_run: 0, cue: "▲", show_question: true,  response: ready}
  opposite:      {per_run: 0, cue: "✖", show_question: true,  response: opposite}

console:                         # operator readout in the terminal
  refresh_hz: 10                 # live redraw rate; 0 for one plain line per trial
  colour: true

keys:
  quit: ["escape"]
  advance: ["space"]

instructions: |
  Respond during the 1-second window, then return to fixation.

  Press SPACE when you are ready.
